[project]
name = "gpt"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "numpy>=2.5.4",
    "pyyaml>=6.0.3",
    "regex>=2026.9.29",
    "torch>=2.14.1",
    "wandb>=0.31.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]
